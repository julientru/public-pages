<!doctype html>
<html lang="en">
<head>

  <title>Kids Games</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <h1>🎈 Kids Games 🎈</h1>
  <p class="subtitle">Pick a game and have fun!</p>

  <main class="game-grid">

      <span class="emoji">🧱</span>
      <span class="name">Blocks</span>
      <span class="desc">Turn and drop the falling blocks to fill whole lines.</span>

    <a class="game-card jump" href="games/jump/index.html">
      <span class="emoji">🐸</span>
      <span class="name">Jumpy Frog</span>
      <span class="desc">Jump over the rocks. How far can you go?</span>
    </a>
    <a class="game-card memory" href="games/memory/index.html">
      <span class="emoji">🃏</span>
      <span class="name">Memory Match</span>
      <span class="desc">Flip the cards and find all the pairs.</span>
    </a>

</html>
