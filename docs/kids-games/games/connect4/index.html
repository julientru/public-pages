<!doctype html> <html lang="en"> <head> <meta charset="utf-8"> <meta name="viewport" content="width=device-width,initial-scale=1"> <title>Four in a Row</title> <link rel="stylesheet" href="../../css/style.f8360af4.css"> <style>body,html{height:100%;overflow:hidden}body{padding:0}#stage{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;padding:16px;overflow:hidden;transition:transform .8s ease-in-out}#stage.flipped{transform:rotate(180deg)}.face{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:10px;font-size:1rem;cursor:pointer}.face input{width:22px;height:22px;accent-color:var(--purple)}.turn{font-size:clamp(1.6rem, 6vw, 2.2rem);font-weight:700;padding:6px 22px;border-radius:999px;margin-bottom:12px;color:#fff;box-shadow:var(--shadow);transition:background .3s ease}.turn.p0{background:#e63946}.turn.p1{background:#f4a300}.board{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:8px;width:min(100%,560px,calc((100dvh - 230px) * 7 / 6));background:var(--blue);border-radius:var(--radius);box-shadow:var(--shadow);touch-action:manipulation;overflow:hidden}.cell{aspect-ratio:1;border:none;padding:0;border-radius:50%;background:var(--bg);cursor:pointer;position:relative}.cell .disc{position:absolute;inset:0;border-radius:50%;transform-origin:50% 100%}.disc.p0{background:radial-gradient(circle at 35% 30%,#ff8a92 0 12%,#e63946 45%,#b81f2c 100%);box-shadow:inset 0 0 0 3px rgba(0,0,0,.15)}.disc.p1{background:radial-gradient(circle at 35% 30%,#fff1a8 0 12%,#ffc300 45%,#d99a00 100%);box-shadow:inset 0 0 0 3px rgba(0,0,0,.12)}.cell.win .disc{box-shadow:inset 0 0 0 5px #fff,0 0 14px 4px #fff;animation:glow .35s ease-in-out infinite alternate;transform-origin:50% 50%}@keyframes glow{to{transform:scale(.86)}}.board{position:relative}.crack{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}.crack polyline{fill:none;stroke:#2b2d42;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:crack .35s ease-out forwards}.crack.big polyline{stroke:#fff;stroke-width:4;filter:drop-shadow(0 0 2px #2b2d42);animation-duration:.7s}@keyframes crack{to{stroke-dashoffset:0}}.shards{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:10}.shards .piece{position:absolute;margin:0;box-sizing:border-box}.shards .disc.piece{border-radius:50%}@media (prefers-reduced-motion:reduce){.cell.win .disc{animation:none}.crack polyline{animation:none;stroke-dashoffset:0}}</style> </head> <body data-no-footer> <div id="stage"> <div class="topbar"> <a class="btn home" href="../../index.html#players=2" aria-label="Back to games">🏠</a> <h1>🔴🟡 Four in a Row</h1> <button class="btn go" id="restart" aria-label="New game">🔄</button> </div> <div class="stats"> <span>🔴 <b id="score0">0</b></span> <span>🟡 <b id="score1">0</b></span> </div> <div class="turn p0" id="turn"></div> <div class="board" id="board"></div> <p class="help">Take turns. Tap a column to drop your disc. Get 4 in a line!</p> <label class="face"><input type="checkbox" id="face"> 🔄 Face to face: turn the screen round</label> </div> <script src="../../js/i18n.472b9c2d.js"></script> <script src="strings.3a8faa80.js"></script> <script src="connect4.75c283d2.js"></script> <script src="../../js/version.69e6f2c6.js"></script> </body> </html>
