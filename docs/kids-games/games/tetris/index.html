<!doctype html> <html lang="en"> <head> <meta charset="utf-8"> <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"> <title>Block Party</title> <link rel="stylesheet" href="../../css/style.f8360af4.css"> <style>body.blocks{height:100vh;height:100dvh;min-height:0;padding:8px 10px 0;overflow:hidden}body.blocks .topbar{margin-bottom:4px}body.blocks .topbar h1{font-size:clamp(1.3rem, 4.5vw, 2.2rem)}body.blocks .message{font-size:clamp(1.1rem, 3.6vw, 1.5rem);min-height:1.8rem;margin:2px 0 6px}body.blocks .site-footer{padding:4px 0;margin-top:0;font-size:.75rem}.play{flex:1 1 auto;min-height:0;width:100%;max-width:1100px;display:grid;gap:10px;grid-template-columns:1fr auto;grid-template-rows:minmax(0,1fr) auto;grid-template-areas:"board info" "pad pad"}.board-wrap{grid-area:board;min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}.board-wrap canvas{width:150px;height:300px}.info{grid-area:info;display:flex;flex-direction:column;gap:8px;align-items:stretch;justify-content:flex-start}.pad{grid-area:pad}.chip{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:6px 10px;text-align:center}.chip small{display:block;font-size:.85rem;opacity:.75}.chip b{font-size:1.4rem}#next{width:72px;height:72px;box-shadow:none;border-radius:10px;margin:2px auto 0;background:#f6f6fb}.pad{display:flex;align-items:center;justify-content:center;gap:12px;padding-bottom:6px}.pad .move{display:flex;gap:10px}.pad .round{width:66px;height:66px;min-width:0;padding:0;border-radius:50%;font-size:2rem}.pad .round.turn{background:var(--purple);order:1}.pad .round[data-action=right]{order:2}.btn.drop{width:96px;height:80px;padding:6px;border-radius:12px;background:repeating-linear-gradient(-45deg,#222 0 8px,#ffd93d 8px 16px);margin-left:22px}.btn.drop .slab{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#e63946;border-radius:7px;font-size:1.6rem;line-height:1}.btn.drop small{font-size:.8rem;letter-spacing:.04em;text-transform:uppercase;margin-top:4px}.help{display:none}@media (min-aspect-ratio:4/5){.play{grid-template-columns:1fr auto auto 1fr;grid-template-rows:minmax(0,1fr);grid-template-areas:". info board pad";gap:18px}.info{justify-content:center;min-width:110px}.pad{flex-direction:column;justify-content:center;align-items:flex-start;gap:14px;padding:0}.pad .move{display:grid;grid-template-columns:72px 72px;gap:10px}.pad .round{width:72px;height:72px}.pad .round.turn{grid-column:1/3;justify-self:center;order:0}.btn.drop{margin:26px 0 0;width:154px;height:72px}.btn.drop .slab{flex-direction:row;gap:8px;font-size:1.8rem}.btn.drop small{font-size:1rem;margin:0}}@media (min-aspect-ratio:4/5) and (max-height:500px){body.blocks .topbar h1{font-size:1.2rem}body.blocks .topbar .btn{min-height:44px;padding:6px 14px}body.blocks .message{font-size:1rem;min-height:1.3rem;margin:0 0 4px}body.blocks .site-footer{display:none}.play{padding-bottom:8px}.pad .round{width:60px;height:60px;font-size:1.7rem}.pad .move{grid-template-columns:60px 60px}.btn.drop{height:60px;width:130px;margin-top:16px}}@media (hover:hover) and (min-height:700px){.help{display:block;margin:4px 0 0}}.board-wrap.shake{animation:shake var(--shake-time,.4s) linear}@keyframes shake{0%,100%{transform:translate(0,0)}10%{transform:translate(calc(var(--amp) * -1),calc(var(--amp) * .5)) rotate(-.6deg)}25%{transform:translate(var(--amp),calc(var(--amp) * -.6)) rotate(.6deg)}40%{transform:translate(calc(var(--amp) * -.8),calc(var(--amp) * .8))}55%{transform:translate(calc(var(--amp) * .7),calc(var(--amp) * -.4)) rotate(-.3deg)}70%{transform:translate(calc(var(--amp) * -.4),calc(var(--amp) * .3))}85%{transform:translate(calc(var(--amp) * .2),0)}}.banner{position:fixed;left:50%;top:42%;z-index:6;transform:translate(-50%,-50%) scale(0);white-space:nowrap;pointer-events:none;font-weight:700;color:#fff;-webkit-text-stroke:2px #2b2d42;paint-order:stroke fill;text-shadow:0 4px 0 #2b2d42,0 0 18px rgba(255,210,60,.9)}.banner.show{animation:banner 1.3s cubic-bezier(.2,1.6,.4,1) forwards}@keyframes banner{0%{transform:translate(-50%,-50%) scale(0) rotate(-12deg);opacity:1}25%{transform:translate(-50%,-50%) scale(1.15) rotate(3deg)}40%{transform:translate(-50%,-50%) scale(1) rotate(-2deg)}80%{transform:translate(-50%,-60%) scale(1) rotate(0);opacity:1}100%{transform:translate(-50%,-90%) scale(.9);opacity:0}}.flash{position:fixed;inset:0;pointer-events:none;z-index:5;background:#fff;opacity:0}.flash.on{animation:flash .5s ease-out}@keyframes flash{0%{opacity:var(--flash, .6)}100%{opacity:0}}#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:4;background:0 0;box-shadow:none;border-radius:0}</style> </head> <body class="blocks"> <div class="topbar"> <a class="btn home" href="../../index.html" aria-label="Back to games">🏠</a> <h1>🎉 Block Party</h1> <button class="btn go" id="start">Play</button> </div> <div class="message" id="message">Press Play to start!</div> <main class="play"> <aside class="info"> <div class="chip"><small>⭐ Score</small><b id="score">0</b></div> <div class="chip"><small>📏 Lines</small><b id="lines">0</b></div> <div class="chip"><small>👀 Next</small><canvas id="next" width="144" height="144"></canvas></div> </aside> <div class="board-wrap" id="boardWrap"> <canvas id="board"></canvas> </div> <div class="pad"> <div class="move"> <button class="btn round turn" data-action="rotate" aria-label="Turn">🔄</button> <button class="btn round" data-action="left" aria-label="Move left">⬅️</button> <button class="btn round" data-action="right" aria-label="Move right">➡️</button> </div> <button class="btn drop" data-action="drop" aria-label="Drop"><span class="slab">⏬<small>Drop</small></span></button> </div> </main> <p class="help">Keyboard: ⬅️ ➡️ to move, ⬆️ to turn, ⬇️ to go faster, Space to drop.</p> <canvas id="fx"></canvas> <div class="flash" id="flash"></div> <div class="banner" id="banner"></div> <script src="../../js/i18n.472b9c2d.js"></script> <script src="../../js/config.2f3b72a6.js"></script> <script src="../../js/accounts.5292b73b.js"></script> <script src="../../js/badges.bca3f57b.js"></script> <script src="strings.b9ac9b6f.js"></script> <script src="effects.cc49a8a6.js"></script> <script src="tetris.775a1542.js"></script> <script src="../../js/version.ae82f3d3.js"></script> </body> </html>
