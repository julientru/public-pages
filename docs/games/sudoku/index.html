<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Picture Sudoku</title>
  <link rel="stylesheet" href="../../css/style.css">
  <style>
    .board {
      display: grid;
      width: min(100%, 440px);
      background: var(--ink);
      border: 4px solid var(--ink);
      border-radius: 16px;
      overflow: hidden;
      gap: 2px;
      box-shadow: var(--shadow);
    }
    .cell {
      aspect-ratio: 1;
      border: none;
      border-radius: 0;
      background: #fff;
      font-size: clamp(1.4rem, 8vw, 2.6rem);
      padding: 0;
      cursor: pointer;
      touch-action: manipulation;
    }
    .cell.given { background: #eef1f6; cursor: default; }
    .cell.selected { background: #fff3b0; }
    .cell.bad { background: #ffd6d6; }
    .cell.box-right { margin-right: 3px; }
    .cell.box-bottom { margin-bottom: 3px; }
    .cell:focus-visible { outline: 4px solid var(--blue); outline-offset: -4px; }
    .palette { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 16px; }
    .palette .btn { font-size: 2rem; min-width: 64px; min-height: 64px; background: #fff; }
    .palette .btn.erase { background: var(--accent); }
  </style>
</head>
<body>
  <div class="topbar">
    <a class="btn home" href="../../index.html" aria-label="Back to games">🏠</a>
    <h1>🍎 Picture Sudoku</h1>
    <button class="btn go" id="restart">New game</button>
  </div>

  <div class="levels" role="group" aria-label="Choose the board size">
    <button class="btn" data-size="4" aria-pressed="true">Easy</button>
    <button class="btn" data-size="6" aria-pressed="false">Hard</button>
  </div>

  <div class="message" id="message">Each row, column and box gets every fruit once!</div>

  <div class="board" id="board"></div>
  <div class="palette" id="palette"></div>
  <p class="help">Tap an empty square, then tap a fruit. Keyboard: Tab to a square, then press 1–6 (or Backspace to clear).</p>

  <script src="sudoku.js"></script>
</body>
</html>
