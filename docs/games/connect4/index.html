<!doctype html> <html lang="en"> <head> <meta charset="utf-8"> <meta name="viewport" content="width=device-width,initial-scale=1"> <title>Four in a Row</title> <link rel="stylesheet" href="../../css/style.b04978d7.css"> <style>.turn{font-size:clamp(1.6rem, 6vw, 2.2rem);font-weight:700;padding:6px 22px;border-radius:999px;margin-bottom:12px;color:#fff;box-shadow:var(--shadow);transition:background .3s ease}.turn.p0{background:#e63946}.turn.p1{background:#f4a300}.board{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:8px;width:min(100%,560px,calc((100dvh - 230px) * 7 / 6));background:var(--blue);border-radius:var(--radius);box-shadow:var(--shadow);touch-action:manipulation;overflow:hidden}.cell{aspect-ratio:1;border:none;padding:0;border-radius:50%;background:var(--bg);cursor:pointer;position:relative}.cell .disc{position:absolute;inset:0;border-radius:50%;animation:drop .35s ease-in}.disc.p0{background:#e63946}.disc.p1{background:#ffc300}.cell.win .disc{box-shadow:inset 0 0 0 5px #fff;animation:glow .6s ease-in-out infinite alternate}@keyframes drop{from{transform:translateY(var(--from))}}@keyframes glow{to{transform:scale(.8)}}</style> </head> <body> <div class="topbar"> <a class="btn home" href="../../index.html#players=2" aria-label="Back to games">🏠</a> <h1>🔴🟡 Four in a Row</h1> <button class="btn go" id="restart" aria-label="New game">🔄</button> </div> <div class="stats"> <span>🔴 <b id="score0">0</b></span> <span>🟡 <b id="score1">0</b></span> </div> <div class="turn p0" id="turn"></div> <div class="board" id="board"></div> <p class="help">Take turns. Tap a column to drop your disc. Get 4 in a line!</p> <script src="../../js/i18n.472b9c2d.js"></script> <script src="strings.ff409e02.js"></script> <script src="connect4.9b729816.js"></script> <script src="../../js/version.4786d3a3.js"></script> </body> </html>
