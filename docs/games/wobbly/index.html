<!doctype html> <html lang="en"> <head> <meta charset="utf-8"> <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"> <title>Wobbly Tower</title> <link rel="stylesheet" href="../../css/style.bbc612ef.css"> <style>body,html{height:100%;overflow:hidden}body{padding:0;background:#bde0fe}#stage{position:fixed;inset:0;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}#stage canvas{display:block;width:100%;height:100%;border-radius:0;box-shadow:none;background:0 0}.hud{position:absolute;top:max(6px,env(safe-area-inset-top));left:max(6px,env(safe-area-inset-left));right:max(6px,env(safe-area-inset-right));display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}.hud-row{width:100%;max-width:900px;display:flex;align-items:center;gap:6px}.hud .btn{pointer-events:auto;min-width:44px;min-height:44px;padding:4px 8px;font-size:1.2rem}.hud .btn.sound-toggle{background:#b9b9c8}.turn{flex:1 1 auto;min-width:0;font-size:clamp(.95rem, 4.2vw, 1.4rem);font-weight:700;text-align:center;padding:8px 12px;border-radius:999px;color:#fff;background:var(--purple);box-shadow:var(--shadow);transition:background .3s ease;text-shadow:0 1px 2px rgba(0,0,0,.35)}.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;font-size:clamp(.9rem, 3.8vw, 1.1rem)}.chips span{background:rgba(255,255,255,.9);padding:3px 12px;border-radius:12px;box-shadow:0 3px 0 rgba(0,0,0,.12)}.hint{margin:0;padding:4px 12px;border-radius:12px;background:rgba(255,255,255,.85);font-size:clamp(.85rem, 3.6vw, 1.05rem);text-align:center;max-width:520px}.hint[hidden]{display:none}.controls{position:absolute;left:0;right:0;bottom:max(10px,env(safe-area-inset-bottom));display:flex;justify-content:center;gap:8px;padding:0 8px}.controls .btn{flex:0 1 auto;min-width:54px;min-height:64px;font-size:1.6rem;padding:6px 10px;white-space:nowrap}.controls .btn.turnbtn{background:var(--purple);font-size:clamp(.95rem, 4.2vw, 1.4rem)}.controls .btn.dropbtn{background:var(--green);font-size:clamp(1.05rem, 4.6vw, 1.6rem)}.controls .btn:disabled{opacity:.45;cursor:default}.over{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.25)}.over[hidden]{display:none}.over .card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:20px 24px;margin:16px;max-width:420px;text-align:center;font-size:clamp(1.3rem, 5.5vw, 1.8rem);font-weight:700;animation:pop .35s ease-out}.over .card p{margin:0 0 16px}@keyframes pop{from{transform:scale(.6);opacity:0}}</style> </head> <body data-no-footer> <div id="stage"> <canvas id="game" aria-label="Wobbly Tower"></canvas> <div class="hud" id="hud"> <div class="hud-row"> <a class="btn home" href="../../index.html#players=2" aria-label="Back to games">🏠</a> <div class="turn" id="turn" aria-live="polite"></div> <button class="btn go" id="restart" aria-label="New game">🔄</button> </div> <div class="chips"> <span>🔴 <b id="score0">0</b></span> <span>🟡 <b id="score1">0</b></span> <span>📏 <b id="height">0.0 m</b></span> </div> <p class="hint" id="hint">Tap the character to turn it, slide it sideways, then Drop! Don't let anything fall in the sea.</p> </div> <div class="controls" id="controls"> <button class="btn" id="left" aria-label="Move left">⬅️</button> <button class="btn turnbtn" id="rotate">🔃 Turn</button> <button class="btn dropbtn" id="drop">⬇️ Drop</button> <button class="btn" id="right" aria-label="Move right">➡️</button> </div> <div class="over" id="over" hidden> <div class="card"> <p id="over-text"></p> <button class="btn go" id="again">🔄 Play again</button> </div> </div> </div> <script src="../../js/i18n.1df9ffc6.js"></script> <script src="../../js/sound.a4f39f71.js"></script> <script src="../../js/lib/planck.df9b7f4c.min.js"></script> <script src="strings.19ec9235.js"></script> <script src="characters.1729c7c3.js"></script> <script src="wobbly.df4e10ef.js"></script> <script src="../../js/version.ef994ba6.js"></script> </body> </html>
