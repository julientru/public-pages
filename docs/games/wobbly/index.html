px;font-size:clamp(.9rem, 3.8vw, 1.05rem);font-weight:400;cursor:pointer}.face[hidden]{display:none}.face input{width:24px;height:24px;accent-color:var(--purple)}.difficulties{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.difficulties .btn{flex-direction:column;gap:2px;min-width:0;padding:8px 6px;line-height:1.15;font-size:clamp(1.05rem, 4.6vw, 1.3rem)}.difficulties .btn small{font-size:clamp(.72rem, 3.2vw, .85rem);font-weight:400}.difficulties .btn .best:empty{display:none}@keyframes pop{from{transform:scale(.6);opacity:0}}</style> </head> <body data-no-footer> <div id="stage"> <canvas id="game" aria-label="Wobbly Tower"></canvas> <div class="hud" id="hud"> <div class="hud-row"> <a class="btn home" id="home" href="../../index.html#players=2" aria-label="Back to games">🏠</a> <div class="turn" id="turn" aria-live="polite"></div> <button class="btn go" id="restart" aria-label="New game">🔄</button> </div> <div class="chips"> <span class="level" id="level"></span> <span class="duo">🔴 <b id="score0">0</b></span> <span class="duo">🟡 <b id="score1">0</b></span> <span class="solo">🦒 <b id="stacked">0</b></span> <span class="solo">⭐ <b id="best">0</b></span> <span>📏 <b id="height">0.0 m</b></span> </div> <p class="hint" id="hint">Tap the character to turn it, slide it sideways, then Drop! Don't let anything fall in the sea.</p> </div> <div class="controls" id="controls"> <button class="btn" id="left" aria-label="Move left">⬅️</button> <button class="btn turnbtn" id="rotate">🔃 Turn</button> <button class="btn dropbtn" id="drop">⬇️ Drop</button> <button class="btn" id="right" aria-label="Move right">➡️</button> </div> <div class="swap" id="swap" hidden></div> <div class="over" id="over" hidden> <div class="card"> <p id="over-text"></p> <div class="row"> <button class="btn go" id="again">🔄 Play again</button> <button class="btn" id="levels">🎚️ Change level</button> </div> </div> </div> <div class="over" id="start" hidden> <div class="card start-card"> <h2>🦒 Wobbly Tower</h2> <div class="pick" role="group" aria-label="How many players?"> <button class="btn" data-players="1">👤 1 player</button> <button class="btn" data-players="2">👥 2 players</button> </div> <label class="face" id="face-row"><input type="checkbox" id="face"> 🔄 Face to face: turn the screen round</label> <div class="difficulties"> <button class="btn" data-level="easy"><span class="name">Easy</span><small class="how"></small><small class="best"></small></button> <button class="btn" data-level="normal"><span class="name">Normal</span><small class="how"></small><small class="best"></small></button> <button class="btn" data-level="hard"><span class="name">Hard</span><small class="how"></small><small class="best"></small></button> <button class="btn" data-level="mega"><span class="name">Mega-hard</span><small class="how"></small><small class="best"></small></button> </div> </div> </div> </div> <script src="../../js/i18n.472b9c2d.js"></script> <script src="../../js/config.2f3b72a6.js"></script> <script src="../../js/accounts.4757963f.js"></script> <script src="../../js/badges.616c2ba8.js"></script> <script src="../../js/sound.2e99e836.js"></script> <script src="../../js/lib/planck.df9b7f4c.min.js"></script> <script src="strings.9d833525.js"></script> <script src="characters.1729c7c3.js"></script> <script src="wobbly.e38aeb8e.js"></script> <script src="../../js/version.54842078.js"></script> </body> </html>
