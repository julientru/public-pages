<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Army Rush FPS</title>
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="../army/city.css">
  <style>
    html, body { height: 100%; overflow: hidden; }
    body { padding: 0; background: #bde0fe; }
    /* The whole screen is the view, upright or on its side. */
    #stage {
      position: fixed; inset: 0;
      overflow: hidden;
      background: #bde0fe;
      touch-action: none;
      cursor: none;
      user-select: none;
      -webkit-user-select: none;
    }
    #stage canvas { width: 100%; height: 100%; border-radius: 0; box-shadow: none; background: none; }
    #stage .layer { position: absolute; inset: 0; pointer-events: none; }
    #hurt { background: #ff6b6b; opacity: 0; }
    .hud {
      position: absolute; top: max(6px, env(safe-area-inset-top)); left: max(6px, env(safe-area-inset-left)); right: max(6px, env(safe-area-inset-right));
      display: flex; align-items: center; gap: 6px; pointer-events: none;
      font-size: clamp(0.85rem, 3.6vw, 1.1rem);
    }
    .hud .btn.home { pointer-events: auto; min-width: 44px; min-height: 44px; padding: 4px 8px; font-size: 1.2rem; cursor: pointer; }
    .hud .btn.city-open { pointer-events: auto; min-width: 44px; min-height: 44px; padding: 4px 8px; font-size: 1.2rem; }
    .hud .city-open span { background: none; padding: 0; }
    #menu .city-toggle { flex: 0 0 100%; justify-content: center; margin: 0; }
    .hud span { background: rgba(255, 255, 255, 0.85); padding: 4px 8px; border-radius: 12px; font-weight: bold; white-space: nowrap; }
    .hud #weapon { margin-left: auto; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    #banner {
      position: absolute; left: 6%; right: 6%; top: 15%;
      padding: 10px 12px; border-radius: 16px;
      background: rgba(43, 45, 66, 0.7); color: #fff;
      font-weight: bold; font-size: clamp(1rem, 5vw, 1.6rem); text-align: center;
      pointer-events: none;
    }
    /* The cross-hair: turns red over an enemy or a box, and flashes an X on a hit. */
    #cross {
      position: absolute; width: 56px; height: 56px; margin: -28px 0 0 -28px;
      pointer-events: none; color: #fff; filter: drop-shadow(0 0 2px #2b2d42) drop-shadow(0 0 1px #2b2d42);
      transition: transform 0.08s;
    }
    #cross[hidden] { display: none; }
    #cross svg { width: 100%; height: 100%; overflow: visible; }
    #cross .x { opacity: 0; }
    #cross.on { color: #ff6b6b; transform: scale(0.85); }
    #cross.hit .x { opacity: 1; }
    .gauges {
      position: absolute; left: 50%; transform: translateX(-50%);
      bottom: max(8px, env(safe-area-inset-bottom)); width: min(56%, 360px);
      display: flex; flex-direction: column; gap: 4px; pointer-events: none; font-size: 0.9rem;
    }
    .gauge { display: flex; align-items: center; gap: 6px; }
    .gauge .bar { flex: 1; height: 12px; border-radius: 7px; background: #2b2d42; padding: 2px; }
    .gauge i { display: block; height: 100%; border-radius: 5px; background: #6bcb77; transition: width 0.2s; }
    #wallFill { background: #e09f3e; }
    #wallGauge.gone { opacity: 0.4; }
    .turn {
      position: absolute; bottom: max(10px, env(safe-area-inset-bottom));
      min-width: 64px; min-height: 64px; font-size: 1.8rem; padding: 0;
      background: rgba(77, 150, 255, 0.75); cursor: pointer;
    }
    #left { left: max(10px, env(safe-area-inset-left)); }
    #right { right: max(10px, env(safe-area-inset-right)); }
    #screen {
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
      background: rgba(43, 45, 66, 0.45); color: #fff; text-align: center; padding: 64px 12px 120px;
      font-weight: bold; font-size: clamp(0.95rem, 4.4vw, 1.4rem);
      text-shadow: -2px -2px 0 #2b2d42, 2px -2px 0 #2b2d42, -2px 2px 0 #2b2d42, 2px 2px 0 #2b2d42, 0 3px 0 #2b2d42;
    }
    #screen[hidden] { display: none; }
    #screen .big { font-size: 1.7em; color: #ffd93d; }
    #screen .go { font-size: 1.3em; color: #6bcb77; margin-top: 8px; }
    #screen .bad { color: #ff6b6b; }
    #screen .gold { color: #ffd93d; }
    #screen a { color: #ffd93d; pointer-events: auto; }
    #menu {
      position: absolute; left: 84px; right: 84px; bottom: max(12px, env(safe-area-inset-bottom));
      justify-content: center;
      flex-wrap: wrap; gap: 6px; margin: 0;
    }
    #menu[hidden], .gauges[hidden] { display: none; }
    @media (max-width: 520px) { #menu { left: 8px; right: 8px; bottom: 96px; flex-wrap: nowrap; } }
    #menu:has(.city-toggle) { flex-wrap: wrap; }
    #menu .btn { min-height: 44px; padding: 6px 10px; font-size: clamp(0.85rem, 3.6vw, 1.1rem); cursor: pointer; }
    @media (orientation: landscape) and (max-height: 500px) {
      #screen { padding-top: 48px; padding-bottom: 64px; font-size: clamp(0.8rem, 3.4vh, 1.2rem); gap: 0; }
    }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="game"></canvas>
    <div class="layer" id="hurt"></div>
    <div id="banner" hidden></div>
    <div id="cross" hidden>
      <svg viewBox="-28 -28 56 56" aria-hidden="true">
        <g fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round">
          <circle r="15"></circle>
          <path d="M0 -26V-9M0 26V9M-26 0H-9M26 0H9"></path>
          <path class="x" d="M-12 -12L-5 -5M12 -12L5 -5M-12 12L-5 5M12 12L5 5" stroke="#ffd93d"></path>
        </g>
        <circle r="2.5" fill="currentColor"></circle>
      </svg>
    </div>
    <div class="gauges">
      <div class="gauge" id="lifeGauge"><span>❤️</span><div class="bar"><i id="lifeFill" style="width: 100%"></i></div></div>
      <div class="gauge" id="wallGauge"><span>🧱</span><div class="bar"><i id="wallFill" style="width: 100%"></i></div></div>
    </div>
    <div class="layer" id="screen"></div>
    <div class="levels" id="menu" role="group" aria-label="Choose how hard">
      <button class="btn" data-level="easy" aria-pressed="true">Easy</button>
      <button class="btn" data-level="normal" aria-pressed="false">Normal</button>
      <button class="btn" data-level="hard" aria-pressed="false">Hard</button>
      <button class="btn" data-level="mega" aria-pressed="false">Mega-hard</button>
    </div>
    <button class="btn turn" id="left" aria-label="Look left">⬅️</button>
    <button class="btn turn" id="right" aria-label="Look right">➡️</button>
    <div class="hud">
      <a class="btn home" href="../../index.html" aria-label="Back to games">🏠</a>
      <span>🌊 <b id="wave">1</b>/12</span>
      <span>❤️ <b id="life">100</b></span>
      <span id="weapon">🪨 Stones</span>
    </div>
  </div>

  <script src="../../js/i18n.js"></script>
  <script src="../../js/config.js"></script>
  <script src="../../js/accounts.js"></script>
  <script src="../../js/lib/three.min.js"></script>
  <script src="../army/strings.js"></script>
  <script src="../army3d/strings.js"></script>
  <script src="strings.js"></script>
  <script src="../army/city-strings.js"></script>
  <script src="../army/city.js"></script>
  <script src="armyfps.js"></script>
</body>
</html>
