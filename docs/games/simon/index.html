<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Copy Me</title>
  <link rel="stylesheet" href="../../css/style.css">
  <style>
    .pads { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; width: min(100%, 420px); }
    .pad {
      aspect-ratio: 1;
      border: none;
      border-radius: 28px;
      font-size: clamp(2.6rem, 14vw, 4.5rem);
      box-shadow: var(--shadow);
      cursor: pointer;
      opacity: 0.55;
      transition: opacity 0.1s ease, transform 0.1s ease;
      touch-action: manipulation;
      position: relative;
    }
    .pad.lit { opacity: 1; transform: scale(1.05); }
    .pad:disabled { cursor: default; }
    .pad .key { position: absolute; top: 8px; left: 12px; font-size: 1rem; color: #fff; font-weight: bold; }
    .pad:focus-visible { outline: 4px solid var(--ink); outline-offset: 3px; }
    .pad.red { background: #ff6b6b; }
    .pad.green { background: #6bcb77; }
    .pad.blue { background: #4d96ff; }
    .pad.yellow { background: #ffc93d; }
  </style>
</head>
<body>
  <div class="topbar">
    <a class="btn home" href="../../index.html" aria-label="Back to games">🏠</a>
    <h1>🎵 Copy Me</h1>
    <button class="btn go" id="start">Play</button>
  </div>

  <div class="stats">
    <span>⭐ Score: <b id="score">0</b></span>
    <span>🏆 Best: <b id="best">0</b></span>
  </div>
  <div class="message" id="message">Press Play, watch, then copy!</div>

  <div class="pads" id="pads">
    <button class="pad red" data-pad="0" aria-label="Red cat" disabled><span class="key">1</span>🐱</button>
    <button class="pad green" data-pad="1" aria-label="Green frog" disabled><span class="key">2</span>🐸</button>
    <button class="pad blue" data-pad="2" aria-label="Blue fish" disabled><span class="key">3</span>🐟</button>
    <button class="pad yellow" data-pad="3" aria-label="Yellow chick" disabled><span class="key">4</span>🐥</button>
  </div>
  <p class="help">Watch the animals light up, then tap them in the same order. Keys 1 2 3 4 work too.</p>

  <script src="simon.js"></script>
</body>
</html>
