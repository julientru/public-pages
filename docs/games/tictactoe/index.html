<!doctype html> <html lang="en"> <head> <meta charset="utf-8"> <meta name="viewport" content="width=device-width,initial-scale=1"> <title>Tic-Tac-Toe</title> <link rel="stylesheet" href="../../css/style.bbc612ef.css"> <style>.board{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:min(100%,400px)}.spot{aspect-ratio:1;border:none;border-radius:20px;background:#fff;font-size:clamp(2.6rem, 16vw, 4.5rem);box-shadow:var(--shadow);cursor:pointer;touch-action:manipulation;position:relative}.spot .key{position:absolute;top:6px;left:10px;font-size:.85rem;opacity:.4}.spot.line{background:#fff3b0}.spot:disabled{cursor:default;color:inherit}.spot:focus-visible{outline:4px solid var(--blue);outline-offset:3px}</style> </head> <body> <div class="topbar"> <a class="btn home" href="../../index.html" aria-label="Back to games">🏠</a> <h1>⭕ Tic‑Tac‑Toe</h1> <button class="btn go" id="restart">New game</button> </div> <div class="levels" role="group" aria-label="Choose how clever the robot is"> <button class="btn" data-level="easy" aria-pressed="true">Easy robot</button> <button class="btn" data-level="hard" aria-pressed="false">Clever robot</button> </div> <div class="stats"> <span>🙂 You: <b id="you">0</b></span> <span>🤖 Robot: <b id="robot">0</b></span> <span>🤝 Draws: <b id="draws">0</b></span> </div> <div class="message" id="message">You are ❌. Get three in a row!</div> <div class="board" id="board"></div> <p class="help">Tap a square to put your ❌. Keys 1–9 work too (1 is top left, 9 is bottom right).</p> <script src="../../js/i18n.1df9ffc6.js"></script> <script src="strings.d0eaaf45.js"></script> <script src="tictactoe.77cfe8e9.js"></script> <script src="../../js/version.ef994ba6.js"></script> </body> </html>
