<!doctype html> <html lang="en"> <head> <meta charset="utf-8"> <meta name="viewport" content="width=device-width,initial-scale=1"> <title>Slide Puzzle</title> <link rel="stylesheet" href="../../css/style.5a6adfe0.css"> <style>.board{display:grid;gap:8px;width:min(100%,420px)}.tile{aspect-ratio:1;border:none;border-radius:16px;font:inherit;font-size:clamp(1.8rem, 9vw, 3rem);font-weight:700;color:#fff;box-shadow:var(--shadow);cursor:pointer;touch-action:manipulation}.tile.blank{background:0 0;box-shadow:none;cursor:default}.tile.home{outline:4px solid #fff;outline-offset:-8px}.tile:focus-visible{outline:4px solid var(--ink);outline-offset:2px}</style> </head> <body> <div class="topbar"> <a class="btn home" href="../../index.html" aria-label="Back to games">🏠</a> <h1>🧩 Slide Puzzle</h1> <button class="btn go" id="restart">New game</button> </div> <div class="levels" role="group" aria-label="Choose the board size"> <button class="btn" data-size="3" aria-pressed="true">Easy</button> <button class="btn" data-size="4" aria-pressed="false">Hard</button> </div> <div class="stats"> <span>👆 Moves: <b id="moves">0</b></span> </div> <div class="message" id="message">Put the numbers in order!</div> <div class="board" id="board"></div> <p class="help">Tap a number next to the empty space to slide it. Or use the arrow keys ⬅️ ➡️ ⬆️ ⬇️.</p> <script src="../../js/i18n.1df9ffc6.js"></script> <script src="strings.293f2254.js"></script> <script src="slide.44f20728.js"></script> <script src="../../js/version.d77786db.js"></script> </body> </html>
