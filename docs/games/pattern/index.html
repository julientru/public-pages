<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>What's Next?</title>
  <link rel="stylesheet" href="../../css/style.css">
  <style>
    .row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      width: min(100%, 760px);
      background: #fff;
      padding: 16px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .item {
      width: clamp(44px, 12vw, 72px);
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(1.8rem, 8vw, 3rem);
      border-radius: 14px;
      background: #f3f6fb;
    }
    .item.ask { background: var(--yellow); font-weight: bold; animation: pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 50% { transform: scale(1.1); } }
    .choices { display: flex; gap: 14px; justify-content: center; margin-top: 18px; flex-wrap: wrap; }
    .choices .btn { font-size: clamp(2.4rem, 12vw, 3.6rem); min-width: 96px; min-height: 96px; background: #fff; position: relative; }
    .choices .btn.right { background: var(--green); }
    .choices .btn.wrong { background: #ffd6d6; }
    .choices .key { position: absolute; top: 4px; left: 8px; font-size: 0.9rem; color: var(--ink); opacity: 0.6; }
  </style>
</head>
<body>
  <div class="topbar">
    <a class="btn home" href="../../index.html" aria-label="Back to games">🏠</a>
    <h1>🔁 What's Next?</h1>
    <button class="btn go" id="restart">New game</button>
  </div>

  <div class="stats">
    <span>⭐ Stars: <b id="stars">0</b></span>
    <span>🔥 In a row: <b id="streak">0</b></span>
  </div>
  <div class="message" id="message">What comes next?</div>

  <div class="row" id="row" aria-live="polite"></div>
  <div class="choices" id="choices"></div>
  <p class="help">Look at the pattern and pick what goes in the ❓ spot. Keys 1 2 3 work too.</p>

  <script src="pattern.js"></script>
</body>
</html>
