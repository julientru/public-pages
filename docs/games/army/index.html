<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Army Rush</title>
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="../army/city.css">
  <style>
    html, body { height: 100%; overflow: hidden; }
    body { padding: 0; background: #74c69d; }
    /* The whole screen is the field, upright or on its side. */
    #stage {
      position: fixed; inset: 0;
      overflow: hidden;
      background: #74c69d;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    #stage canvas { display: block; width: 100%; height: 100%; border-radius: 0; box-shadow: none; background: none; cursor: pointer; }
    .hud {
      position: absolute; top: max(6px, env(safe-area-inset-top)); left: max(6px, env(safe-area-inset-left)); right: max(6px, env(safe-area-inset-right));
      display: flex; align-items: center; gap: 6px; pointer-events: none;
      font-size: clamp(0.85rem, 3.6vw, 1.1rem);
    }
    .hud .btn.home { pointer-events: auto; min-width: 44px; min-height: 44px; padding: 4px 8px; font-size: 1.2rem; cursor: pointer; }
    .hud .btn.city-open { pointer-events: auto; min-width: 44px; min-height: 44px; padding: 4px 8px; font-size: 1.2rem; }
    .hud .city-open span { background: none; padding: 0; }
    #menu .city-toggle { flex: 0 0 100%; justify-content: center; margin: 0; }
    .hud span { background: rgba(255, 255, 255, 0.85); padding: 4px 8px; border-radius: 12px; font-weight: bold; white-space: nowrap; }
    .hud #weapon { margin-left: auto; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    .turn {
      position: absolute; bottom: max(10px, env(safe-area-inset-bottom));
      min-width: 64px; min-height: 64px; font-size: 1.8rem; padding: 0;
      background: rgba(77, 150, 255, 0.75); cursor: pointer;
    }
    #left { left: max(10px, env(safe-area-inset-left)); }
    #right { right: max(10px, env(safe-area-inset-right)); }
    #menu {
      position: absolute; left: 84px; right: 84px; bottom: max(12px, env(safe-area-inset-bottom));
      justify-content: center;
      flex-wrap: wrap; gap: 6px; margin: 0;
    }
    #menu[hidden] { display: none; }
    @media (max-width: 520px) { #menu { left: 8px; right: 8px; bottom: 96px; flex-wrap: nowrap; } }
    #menu:has(.city-toggle) { flex-wrap: wrap; }
    #menu .btn { min-height: 44px; padding: 6px 10px; font-size: clamp(0.85rem, 3.6vw, 1.1rem); cursor: pointer; }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="game" width="480" height="640"></canvas>
    <div class="levels" id="menu" role="group" aria-label="Choose how hard">
      <button class="btn" data-level="easy" aria-pressed="true">Easy</button>
      <button class="btn" data-level="normal" aria-pressed="false">Normal</button>
      <button class="btn" data-level="hard" aria-pressed="false">Hard</button>
      <button class="btn" data-level="mega" aria-pressed="false">Mega-hard</button>
    </div>
    <button class="btn turn" id="left" aria-label="Move left">⬅️</button>
    <button class="btn turn" id="right" aria-label="Move right">➡️</button>
    <div class="hud">
      <a class="btn home" href="../../index.html" aria-label="Back to games">🏠</a>
      <span>🌊 <b id="wave">1</b>/12</span>
      <span>❤️ <b id="life">100</b></span>
      <span id="weapon">🪨 Stones</span>
    </div>
  </div>

  <script src="../../js/i18n.js"></script>
  <script src="strings.js"></script>
  <script src="../army/city-strings.js"></script>
  <script src="../army/city.js"></script>
  <script src="army.js"></script>
</body>
</html>
