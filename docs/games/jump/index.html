<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jumpy Frog</title>
  <link rel="stylesheet" href="../../css/style.css">
  <style>
    #game { width: min(100%, 900px); height: auto; aspect-ratio: 8 / 3; cursor: pointer; }
    .controls .btn.jump { font-size: 1.8rem; min-width: 220px; }
  </style>
</head>
<body>
  <div class="topbar">
    <a class="btn home" href="../../index.html" aria-label="Back to games">🏠</a>
    <h1>🐸 Jumpy Frog</h1>
    <span></span>
  </div>

  <div class="stats">
    <span>⭐ Score: <b id="score">0</b></span>
    <span>🏆 Best: <b id="best">0</b></span>
  </div>
  <div class="message" id="message">Tap or press Space to start!</div>

  <canvas id="game" width="800" height="300"></canvas>

  <div class="controls">
    <button class="btn go jump" id="jump">⬆️ Jump!</button>
  </div>
  <p class="help">Tap the game, press the Jump button, or press Space / ⬆️ to jump over the rocks.</p>

  <script src="jump.js"></script>
</body>
</html>
