<!doctype html> <html lang="en"> <head> <meta charset="utf-8"> <meta name="viewport" content="width=device-width,initial-scale=1"> <title>Color Flood</title> <link rel="stylesheet" href="../../css/style.5a6adfe0.css"> <style>.board{display:grid;width:min(100%,440px,55vh);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);touch-action:manipulation}.board div{aspect-ratio:1;cursor:pointer;transition:background .25s ease}.board div.mine{box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}.colors{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:16px}.colors .btn{min-width:64px;min-height:64px;font-size:1.6rem;position:relative}.colors .key{position:absolute;top:3px;left:7px;font-size:.8rem}.colors .btn:disabled{opacity:.35}</style> </head> <body> <div class="topbar"> <a class="btn home" href="../../index.html" aria-label="Back to games">🏠</a> <h1>🌊 Color Flood</h1> <button class="btn go" id="restart">New game</button> </div> <div class="levels" role="group" aria-label="Choose the board size"> <button class="btn" data-level="0" aria-pressed="true">Easy</button> <button class="btn" data-level="1" aria-pressed="false">Medium</button> <button class="btn" data-level="2" aria-pressed="false">Hard</button> </div> <div class="stats"> <span>🎨 Moves left: <b id="left">0</b></span> </div> <div class="message" id="message">Fill the whole board with one color!</div> <div class="board" id="board"></div> <div class="colors" id="colors"></div> <p class="help">Your color starts in the top-left corner ↖️. Pick a color to grow it. Tap a square, a color button, or press 1–6.</p> <script src="../../js/i18n.1df9ffc6.js"></script> <script src="strings.56896d94.js"></script> <script src="flood.846fabaa.js"></script> <script src="../../js/version.d77786db.js"></script> </body> </html>
