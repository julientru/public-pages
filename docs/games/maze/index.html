<!doctype html> <html lang="en"> <head> <meta charset="utf-8"> <meta name="viewport" content="width=device-width,initial-scale=1"> <title>Mouse Maze</title> <link rel="stylesheet" href="../../css/style.5a6adfe0.css"> <style>#maze{width:min(100%,520px,58vh);height:auto;aspect-ratio:1}.pad{display:grid;grid-template-columns:repeat(3,72px);gap:8px;margin-top:16px;justify-content:center}.pad .btn{font-size:1.8rem;min-width:72px;min-height:72px;padding:0}.pad .up{grid-column:2}.pad .left{grid-column:1;grid-row:2}.pad .down{grid-column:2;grid-row:2}.pad .right{grid-column:3;grid-row:2}</style> </head> <body> <div class="topbar"> <a class="btn home" href="../../index.html" aria-label="Back to games">🏠</a> <h1>🐭 Mouse Maze</h1> <button class="btn go" id="restart">New maze</button> </div> <div class="levels" role="group" aria-label="Choose the maze size"> <button class="btn" data-size="6" aria-pressed="true">Easy</button> <button class="btn" data-size="9" aria-pressed="false">Medium</button> <button class="btn" data-size="13" aria-pressed="false">Hard</button> </div> <div class="stats"> <span>👣 Steps: <b id="steps">0</b></span> </div> <div class="message" id="message">Help the mouse find the cheese!</div> <canvas id="maze" width="520" height="520"></canvas> <div class="pad"> <button class="btn up" data-dir="up" aria-label="Up">⬆️</button> <button class="btn left" data-dir="left" aria-label="Left">⬅️</button> <button class="btn down" data-dir="down" aria-label="Down">⬇️</button> <button class="btn right" data-dir="right" aria-label="Right">➡️</button> </div> <p class="help">Swipe on the maze, tap the arrows, or use the arrow keys.</p> <script src="../../js/i18n.1df9ffc6.js"></script> <script src="strings.65d96d91.js"></script> <script src="maze.207183b7.js"></script> <script src="../../js/version.70f8b04d.js"></script> </body> </html>
