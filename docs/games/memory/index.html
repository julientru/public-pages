<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Memory Match</title>
  <link rel="stylesheet" href="../../css/style.css">
  <style>
    .board {
      display: grid;
      gap: 10px;
      width: min(100%, 560px);
    }
    .card {
      aspect-ratio: 1;
      border: none;
      border-radius: 16px;
      font-size: clamp(2rem, 9vw, 3.4rem);
      cursor: pointer;
      background: var(--blue);
      box-shadow: var(--shadow);
      color: transparent;
      transition: transform 0.25s ease, background 0.25s ease;
      touch-action: manipulation;
    }
    .card::after { content: "❓"; color: #fff; font-size: 0.6em; }
    .card.up, .card.done { background: #fff; color: inherit; }
    .card.up::after, .card.done::after { content: none; }
    .card.done { background: #dff5e1; cursor: default; }
    .card:focus-visible { outline: 4px solid var(--yellow); outline-offset: 2px; }
  </style>
</head>
<body>
  <div class="topbar">
    <a class="btn home" href="../../index.html" aria-label="Back to games">🏠</a>
    <h1>🃏 Memory Match</h1>
    <button class="btn go" id="restart">New game</button>
  </div>

  <div class="levels" role="group" aria-label="Choose how many cards">
    <button class="btn" data-pairs="6" aria-pressed="true">Easy</button>
    <button class="btn" data-pairs="8" aria-pressed="false">Medium</button>
    <button class="btn" data-pairs="10" aria-pressed="false">Hard</button>
  </div>

  <div class="stats">
    <span>👆 Tries: <b id="tries">0</b></span>
    <span>✅ Pairs: <b id="pairs">0</b></span>
  </div>
  <div class="message" id="message">Find two cards that match!</div>

  <div class="board" id="board"></div>
  <p class="help">Tap a card (or use Tab and Enter) to flip it.</p>

  <script src="../../js/i18n.js"></script>
  <script src="strings.js"></script>
  <script src="memory.js"></script>
</body>
</html>
