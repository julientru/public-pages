<!doctype html> <html lang="en"> <head> <meta charset="utf-8"> <meta name="viewport" content="width=device-width,initial-scale=1"> <title>Lights Out</title> <link rel="stylesheet" href="../../css/style.bbc612ef.css"> <style>.board{display:grid;gap:8px;width:min(100%,440px)}.light{aspect-ratio:1;border:none;border-radius:16px;font-size:clamp(1.6rem, 8vw, 2.6rem);background:#3d405b;box-shadow:var(--shadow);cursor:pointer;transition:background .2s ease;touch-action:manipulation}.light::after{content:"🌑";opacity:.5}.light.on{background:var(--yellow)}.light.on::after{content:"💡";opacity:1}.light:focus-visible{outline:4px solid var(--blue);outline-offset:2px}</style> </head> <body> <div class="topbar"> <a class="btn home" href="../../index.html" aria-label="Back to games">🏠</a> <h1>💡 Lights Out</h1> <button class="btn go" id="restart">New game</button> </div> <div class="levels" role="group" aria-label="Choose the board size"> <button class="btn" data-size="3" aria-pressed="true">Easy</button> <button class="btn" data-size="4" aria-pressed="false">Medium</button> <button class="btn" data-size="5" aria-pressed="false">Hard</button> </div> <div class="stats"> <span>👆 Taps: <b id="moves">0</b></span> <span>💡 Lights on: <b id="left">0</b></span> </div> <div class="message" id="message">Turn off all the lights!</div> <div class="board" id="board"></div> <p class="help">Tapping a light flips it and the lights next to it (up, down, left, right). Tab and Enter work too.</p> <script src="../../js/i18n.1df9ffc6.js"></script> <script src="strings.8b59e9ff.js"></script> <script src="lights.dfa9468a.js"></script> <script src="../../js/version.ef994ba6.js"></script> </body> </html>
