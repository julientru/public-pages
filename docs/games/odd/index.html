<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Odd One Out</title>
  <link rel="stylesheet" href="../../css/style.css">
  <style>
    .board { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; width: min(100%, 420px); }
    .board.five { grid-template-columns: repeat(3, 1fr); width: min(100%, 520px); }
    .choice {
      aspect-ratio: 1;
      border: none;
      border-radius: 24px;
      background: #fff;
      font-size: clamp(2.8rem, 15vw, 4.5rem);
      box-shadow: var(--shadow);
      cursor: pointer;
      touch-action: manipulation;
      position: relative;
    }
    .choice .key { position: absolute; top: 6px; left: 10px; font-size: 0.9rem; opacity: 0.5; }
    .choice.right { background: var(--green); }
    .choice.wrong { background: #ffd6d6; opacity: 0.6; }
    .choice:focus-visible { outline: 4px solid var(--blue); outline-offset: 3px; }
    .hint { font-size: 1.3rem; text-align: center; min-height: 1.8rem; margin-top: 12px; }
  </style>
</head>
<body>
  <div class="topbar">
    <a class="btn home" href="../../index.html" aria-label="Back to games">🏠</a>
    <h1>🔍 Odd One Out</h1>
    <button class="btn go" id="restart">New game</button>
  </div>

  <div class="stats">
    <span>⭐ Stars: <b id="stars">0</b></span>
    <span>🔢 Round: <b id="round">1</b> / 10</span>
  </div>
  <div class="message" id="message">Which one does not belong?</div>

  <div class="board" id="board"></div>
  <div class="hint" id="hint"></div>
  <p class="help">Tap the picture that is different from the others. Keys 1–5 work too.</p>

  <script src="odd.js"></script>
</body>
</html>
